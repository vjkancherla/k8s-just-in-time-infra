apiVersion: apps/v1
kind: Deployment
metadata:
  name: jit-controller
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jit-controller
  template:
    metadata:
      labels:
        app: jit-controller
    spec:
      serviceAccountName: jit-controller
      containers:
      - name: controller
        image: jit-controller
        imagePullPolicy: IfNotPresent
        command: ["python", "-u", "/app/main.py"]
        env:
        - name: SSL_CERT_FILE
          value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        - name: REQUESTS_CA_BUNDLE
          value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        - name: RUNNER_URL
          value: "http://172.19.0.10:8080"
        - name: RUNNER_TOKEN
          valueFrom:
            secretKeyRef:
              name: jit-runner-token
              key: token
---
apiVersion: v1
kind: Secret
metadata:
  name: jit-runner-token
  namespace: default
type: Opaque
stringData:
  token: "s6-secret-token-2026"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jit-controller-code
data:
  main.py: |
    # placeholder - will be replaced by init container
    print("controller")
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jit-controller
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jit-controller
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jit-controller
subjects:
- kind: ServiceAccount
  name: jit-controller
  namespace: default
roleRef:
  kind: ClusterRole
  name: jit-controller
  apiGroup: rbac.authorization.k8s.io
