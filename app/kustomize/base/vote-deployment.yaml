apiVersion: apps/v1
kind: Deployment
metadata:
  name: voting-app-vote
  labels:
    app.kubernetes.io/name: voting-app
    app.kubernetes.io/instance: voting-app
    app.kubernetes.io/component: vote
  annotations:
    # JIT: an annotation is a provisioning request AND a keep-alive lease, not a
    # list of the pod's dependencies. The controller reads only this metadata -
    # it never inspects a pod spec - so the module list must name every
    # Deployment that uses the module, or the last-reference rule can arm a
    # destroy clock under a pod that is still running.
    #
    # vote consumes Redis and nothing else: it has no Postgres environment and
    # no jit-postgres Secret reference. Postgres is leased by the two Deployments
    # that actually read that database, worker and result.
    #
    # pgadmin has no consumer at all, so its lease holder is a deliberate demo
    # choice rather than a dependency: it lives here so the soft-delete path has
    # something to orphan, and because pgadmin is the only module with a
    # cross-module dependency - it stays pending until jit-postgres is Ready
    # (resolve_postgres_credentials in the controller).
    #
    # softDeleteTTL is the two-speed cleanup window: deleting this Deployment
    # orphans whatever only it leases (pgadmin today), destroyed after 10m;
    # deleting the *namespace* destroys immediately. It is deliberately long
    # enough to cover a redeploy inside the window, which reuses the same
    # containers and so keeps the data.
    jit.infra/redis: '{"module":"redis","moduleVersion":"v1","params":{},"softDeleteTTL":"10m"}'
    jit.infra/pgadmin: '{"module":"pgadmin","moduleVersion":"v1","params":{},"softDeleteTTL":"10m"}'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: voting-app
      app.kubernetes.io/instance: voting-app
      app.kubernetes.io/component: vote
  template:
    metadata:
      labels:
        app.kubernetes.io/name: voting-app
        app.kubernetes.io/instance: voting-app
        app.kubernetes.io/component: vote
    spec:
      containers:
        - name: vote
          image: vote:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: voting-app-secret-key
                  key: SECRET_KEY
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: jit-redis
                  key: service_url
            - name: OPTIONS
              value: '["Cats","Dogs"]'
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
