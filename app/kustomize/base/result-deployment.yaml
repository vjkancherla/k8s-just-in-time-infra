apiVersion: apps/v1
kind: Deployment
metadata:
  name: voting-app-result
  labels:
    app.kubernetes.io/name: voting-app
    app.kubernetes.io/instance: voting-app
    app.kubernetes.io/component: result
  annotations:
    # JIT: result reads Postgres and nothing else, so it leases postgres.
    # It previously carried no annotation, which made it an invisible consumer:
    # no claim's status.referencedBy mentioned it, and deleting the vote
    # Deployment armed a 10m destroy clock on the database this pod queries.
    jit.infra/postgres: '{"module":"postgres","moduleVersion":"v1","params":{},"softDeleteTTL":"10m"}'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: voting-app
      app.kubernetes.io/instance: voting-app
      app.kubernetes.io/component: result
  template:
    metadata:
      labels:
        app.kubernetes.io/name: voting-app
        app.kubernetes.io/instance: voting-app
        app.kubernetes.io/component: result
    spec:
      initContainers:
        # Wait for Postgres to be reachable before serving results. Out of
        # cluster now: reached through the jit-postgres Service. Every connection
        # detail comes from the jit-postgres Secret so the manifest and the app
        # code carry no hardcoded infrastructure values.
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              until pg_isready; do
                echo "waiting for postgres";
                sleep 2;
              done;
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: jit-postgres
                  key: service_host
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: jit-postgres
                  key: port
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: jit-postgres
                  key: POSTGRES_DB
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: jit-postgres
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: jit-postgres
                  key: POSTGRES_PASSWORD
      containers:
        - name: result
          image: result:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: jit-postgres
                  key: service_url
            - name: OPTIONS
              value: '["Cats","Dogs"]'
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
