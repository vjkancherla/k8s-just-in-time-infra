apiVersion: apps/v1
kind: Deployment
metadata:
  name: voting-app-worker
  labels:
    app.kubernetes.io/name: voting-app
    app.kubernetes.io/instance: voting-app
    app.kubernetes.io/component: worker
  annotations:
    # JIT: worker is the only workload that uses both modules - it drains Redis
    # and writes the votes table in Postgres - so it leases both. The annotation
    # is a provisioning request and a keep-alive lease, not a dependency list,
    # and it must name every module the pod uses: a module that is read but not
    # named has no lease on it.
    #
    # postgres is leased here and on result, the two readers of that database,
    # which is what keeps jit-postgres Ready while vote is deleted. This
    # supersedes build-plan S15's vote-centric split (vote: redis, postgres,
    # pgadmin; worker: redis), which left both Postgres readers unrepresented.
    jit.infra/redis: '{"module":"redis","moduleVersion":"v1","params":{},"softDeleteTTL":"10m"}'
    jit.infra/postgres: '{"module":"postgres","moduleVersion":"v1","params":{},"softDeleteTTL":"10m"}'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: voting-app
      app.kubernetes.io/instance: voting-app
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: voting-app
        app.kubernetes.io/instance: voting-app
        app.kubernetes.io/component: worker
    spec:
      initContainers:
        # Single source of truth for the schema: wait for Postgres, then
        # create the table idempotently. Postgres is out of cluster now, reached
        # through the jit-postgres Service the controller writes.
        - name: init-db
          image: postgres:16-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              until pg_isready -h jit-postgres -U postgres; do
                echo "waiting for postgres";
                sleep 2;
              done;
              psql -h jit-postgres -U postgres -d voting -c "CREATE TABLE IF NOT EXISTS votes (voter_id VARCHAR(255) PRIMARY KEY, choice VARCHAR(255) NOT NULL, updated_at TIMESTAMP NOT NULL DEFAULT NOW());"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: jit-postgres
                  key: POSTGRES_PASSWORD
      containers:
        - name: worker
          image: worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_URL
              value: "redis://jit-redis:6379/0"
            - name: PGHOST
              value: "jit-postgres"
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: "voting"
            - name: PGUSER
              value: "postgres"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: jit-postgres
                  key: POSTGRES_PASSWORD
          livenessProbe:
            exec:
              command: ["python", "/app/app.py", "--healthcheck"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["python", "/app/app.py", "--healthcheck"]
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
