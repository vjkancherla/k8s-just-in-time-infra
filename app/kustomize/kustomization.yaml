apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Entry point for a plain `kubectl apply -k kustomize/`.
#
# The manifests live in base/ and the per-environment overlays in overlays/.
# That split is not cosmetic: kustomize refuses an overlay whose resource path
# reaches a directory that contains the overlay itself. With the manifests at
# this level, overlays/registry had to reference `../..` and failed with
#
#   cycle detected: candidate root '.../kustomize' contains visited root
#   '.../kustomize/overlays/registry'
#
# Moving the manifests into base/ lets every overlay reference ../../base - a
# sibling subtree, not an ancestor - and the overlay builds for real.

resources:
  - base
