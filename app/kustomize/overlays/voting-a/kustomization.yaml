apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# One overlay per environment, so the namespace is parameterised rather than
# baked into the manifests (build-plan S15). voting-a and voting-b are the two
# namespaces the S17 demo deploys from this same base.

resources:
  - ../../base

namespace: voting-a
