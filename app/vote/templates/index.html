<div class="w-full relative overflow-hidden py-space-xl md:py-margin-lg">
<div class="absolute top-1/2 left-1/4 -translate-y-1/2 w-96 h-96 bg-primary-fixed/20 rounded-full blur-3xl pointer-events-none -z-10"></div>
<div class="absolute top-1/3 right-1/4 -translate-y-1/2 w-80 h-80 bg-tertiary-fixed/15 rounded-full blur-3xl pointer-events-none -z-10"></div>
<div class="max-w-4xl mx-auto px-margin text-center">

<h1 class="font-display text-display text-on-surface tracking-tight max-w-2xl mx-auto">
        Cast Your Vote
      </h1>


</div>
<div class="max-w-4xl mx-auto px-margin mt-space-xl">
<form action="/vote" class="grid grid-cols-1 md:grid-cols-2 gap-space-lg" id="ballot-form" method="POST">
<div class="group relative rounded-xl bg-surface-container-lowest shadow-sm hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 overflow-hidden flex flex-col justify-between p-space-xl"><div class="absolute top-0 right-0 w-36 h-36 bg-gradient-to-br from-primary-fixed/25 to-transparent rounded-bl-full pointer-events-none"></div><div class="flex flex-col items-center text-center py-space-lg"><div class="w-20 h-20 rounded-2xl bg-surface-container-low flex items-center justify-center shadow-sm group-hover:scale-105 transition-transform duration-300 mb-space-md"><svg class="text-primary" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 8 L8.2 3.2 L10 8"></path><path d="M17.5 8 L15.8 3.2 L14 8"></path><circle cx="12" cy="13.2" r="6.8"></circle><circle cx="9.3" cy="12.6" r="0.75" fill="currentColor" stroke="none"></circle><circle cx="14.7" cy="12.6" r="0.75" fill="currentColor" stroke="none"></circle><path d="M11.2 15 L12.8 15 L12 16.3 Z" fill="currentColor" stroke="none"></path><path d="M5.5 15 L2.3 14.2 M5.3 16.3 L2 16.3 M5.5 17.6 L2.3 18.4"></path><path d="M18.5 15 L21.7 14.2 M18.7 16.3 L22 16.3 M18.5 17.6 L21.7 18.4"></path></svg></div><h2 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">Cats</h2></div><div class="mt-space-lg"><button class="w-full h-12 rounded-xl bg-surface-container-high hover:bg-primary text-on-surface hover:text-on-primary font-headline-sm text-headline-sm flex items-center justify-center gap-2 transition-all duration-200 shadow-sm active:scale-[0.98] group-hover:bg-primary group-hover:text-on-primary" name="choice" value="Cats" type="submit"><span class="material-symbols-outlined text-[18px]">check_circle</span><span class="">Vote Cats</span></button></div></div>
<div class="group relative rounded-xl bg-surface-container-lowest shadow-sm hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 overflow-hidden flex flex-col justify-between p-space-xl"><div class="absolute top-0 right-0 w-36 h-36 bg-gradient-to-br from-tertiary-fixed/30 to-transparent rounded-bl-full pointer-events-none"></div><div class="flex flex-col items-center text-center py-space-lg"><div class="w-20 h-20 rounded-2xl bg-surface-container-low flex items-center justify-center shadow-sm group-hover:scale-105 transition-transform duration-300 mb-space-md"><svg class="text-tertiary" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9.5 C4 9.5 3 13.5 4.5 17 C5.4 19 7 19.3 7.6 17.8 C8.1 16.5 8 12.5 6.5 9.5 Z"></path><path d="M17.5 9.5 C20 9.5 21 13.5 19.5 17 C18.6 19 17 19.3 16.4 17.8 C15.9 16.5 16 12.5 17.5 9.5 Z"></path><circle cx="12" cy="13.5" r="6.3"></circle><circle cx="9.6" cy="12.8" r="0.75" fill="currentColor" stroke="none"></circle><circle cx="14.4" cy="12.8" r="0.75" fill="currentColor" stroke="none"></circle><ellipse cx="12" cy="16.1" rx="1.5" ry="1" fill="currentColor" stroke="none"></ellipse></svg></div><h2 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">Dogs</h2></div><div class="mt-space-lg"><button class="w-full h-12 rounded-xl bg-surface-container-high hover:bg-tertiary text-on-surface hover:text-on-tertiary font-headline-sm text-headline-sm flex items-center justify-center gap-2 transition-all duration-200 shadow-sm active:scale-[0.98] group-hover:bg-tertiary group-hover:text-on-tertiary" name="choice" value="Dogs" type="submit"><span class="material-symbols-outlined text-[18px]">check_circle</span><span class="">Vote Dogs</span></button></div></div>
</form>
</div>


</div>
<div class="fixed bottom-6 right-6 hidden z-50 p-space-md rounded-xl bg-inverse-surface text-inverse-on-surface shadow-xl flex items-center gap-space-md transition-all duration-300 transform translate-y-2" id="confirmation-toast">
<span class="material-symbols-outlined text-tertiary-fixed text-[20px]">task_alt</span>
<div class="flex flex-col">
<span class="font-headline-sm text-headline-sm text-inverse-on-surface" id="toast-title">Vote Submitted</span>
<span class="font-label-sm text-label-sm text-secondary-fixed-dim" id="toast-meta">Ingress acknowledged via stream pipeline</span>
</div>
</div>
<script>
    (function() {
      const form = document.getElementById('ballot-form');
      const toast = document.getElementById('confirmation-toast');
      const toastTitle = document.getElementById('toast-title');
      const toastMeta = document.getElementById('toast-meta');

      if (!form) return;

      const buttons = form.querySelectorAll('button[type="submit"]');
      buttons.forEach(btn => {
        btn.addEventListener('click', function(e) {
          const choice = this.getAttribute('value');
          
          if (toast) {
            toastTitle.textContent = `Voted for ${choice}`;
            toastMeta.textContent = `Payload dispatched at ${new Date().toLocaleTimeString()} (TLS verified)`;
            toast.classList.remove('hidden');
            toast.classList.remove('translate-y-2');
            setTimeout(() => {
              toast.classList.add('translate-y-2');
              setTimeout(() => toast.classList.add('hidden'), 300);
            }, 3500);
          }
        });
      });
    })();
  </script>
</div></main><footer class="w-full bg-surface-container-low mt-space-xl"><div class="max-w-7xl mx-auto px-margin py-space-lg flex items-center justify-center"><div class="font-label-sm text-label-sm text-secondary">© 2025</div></div></footer>

</body></html>
